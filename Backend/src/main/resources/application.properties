spring.application.name=healthdesk
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
server.port=${SERVER_PORT:9112}
server.tomcat.remoteip.remote-ip-header=x-forwarded-for
server.tomcat.remoteip.protocol-header=x-forwarded-proto
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/healthdesk}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.servlet.multipart.max-request-size=-1
spring.servlet.multipart.max-file-size=-1
jwt.secret-key=${JWT_SECRET_KEY}
genai.api.key=${GENAI_API_KEY}
genai.model=${GENAI_MODEL:gemini-2.0-flash}
assemblyai.api.key=${ASSEMBLYAI_API_KEY}
assemblyai.base.url=${ASSEMBLYAI_BASE_URL:https://api.assemblyai.com/v2}
cdn.audio.base-url=${CDN_AUDIO_BASE_URL:https://cdn.example.com/healthdesk/read/audio}
cdn.document.base-url=${CDN_DOCUMENT_BASE_URL:https://cdn.example.com/healthdesk/read/document}
mail.smtp.username=${MAIL_SMTP_USERNAME}
mail.smtp.app-password=${MAIL_SMTP_APP_PASSWORD}
mail.smtp.from=${MAIL_SMTP_FROM:${MAIL_SMTP_USERNAME}}
